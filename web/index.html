<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="BlueWaikiki 지도 — OpenFreeMap · OpenMapTiles · OpenStreetMap">
  <title>BlueWaikiki Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./site.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main class="map-page">
    <div id="map" class="map-canvas" role="region" aria-label="부산에서 시작하는 대화형 지도"></div>
    <header class="map-heading">
      <div class="map-brand">
        <span class="map-brand__symbol" aria-hidden="true">◈</span>
        <div>
          <strong>BlueWaikiki Map</strong>
          <span>OpenFreeMap · OpenMapTiles · OSM</span>
        </div>
      </div>
      <span class="map-label">공개 지도 미리보기</span>
    </header>
    <div class="map-actions" role="group" aria-label="지도 보기 조절">
      <button type="button" id="zoom-in" aria-label="지도 확대" title="확대">+</button>
      <button type="button" id="zoom-out" aria-label="지도 축소" title="축소">−</button>
      <span class="map-actions__divider" aria-hidden="true"></span>
      <button type="button" id="reset-view" aria-label="부산 초기 위치로 이동" title="부산 초기 위치로 이동">⌖</button>
      <span class="map-actions__divider" aria-hidden="true"></span>
      <button type="button" class="map-actions__mode" id="toggle-3d" aria-label="3D 건물 보기" aria-pressed="false" title="건물 입체화" disabled>3D</button>
    </div>
    <dialog id="feature-modal" class="feature-modal" aria-labelledby="feature-modal-title">
      <header class="feature-modal__head">
        <div class="feature-modal__heading">
          <span class="feature-modal__eyebrow" id="feature-kind">벡터 타일 객체</span>
          <h2 id="feature-modal-title">속성 정보</h2>
        </div>
        <button id="feature-modal-close" class="feature-modal__close" type="button" aria-label="속성 창 닫기">×</button>
      </header>
      <div class="feature-modal__body">
        <p class="feature-modal__note" id="feature-modal-note"></p>
        <dl class="feature-modal__meta" id="feature-modal-meta"></dl>
        <h3>타일에 포함된 속성</h3>
        <dl class="feature-modal__properties" id="feature-modal-properties"></dl>
        <details class="feature-modal__raw">
          <summary>원본 GeoJSON 확인</summary>
          <pre id="feature-modal-json"></pre>
        </details>
      </div>
      <footer class="feature-modal__footer">
        <span id="feature-modal-copy-status" class="feature-modal__copy-status" role="status"></span>
        <button type="button" id="feature-modal-copy" class="feature-modal__copy">JSON 복사</button>
      </footer>
    </dialog>
    <div class="map-status-panel">
      <span class="map-status-panel__dot" id="map-dot" aria-hidden="true"></span>
      <span id="map-status" role="status" aria-live="polite">지도 타일을 불러오는 중…</span>
    </div>
  </main>
</body>
</html>
